<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Soup</title>
    <script src="p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrollbars */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column; /* Stack elements vertically */
            height: 100vh; /* Full viewport height */
        }
        #message {
            position: fixed;
            top: 10px;
            width: 100%;
            text-align: center;
            font-size: 20px;
            color: white;
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
            padding: 10px;
        }
        #bottomImage {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px; /* Adjust the width as needed */
            height: auto;
        }
        #gunkImage {
            position: fixed;
            top: 50%;
            left: 70px;
            transform: translateY(-50%);
            width: 300px; /* Adjust the width as needed */
            height: auto;
        }
    </style>
</head>
<body>
    <div id="message">Pick a fairy to serve your soup to with right and left arrow keys</div>
    <script src="script.js"></script>
    <img id="bottomImage" src="leftright.webp" alt="Left Right">
    <img id="gunkImage" src="Gunk.png" alt="Gunk">
</body>
</html>
