<!DOCTYPE html>
<html lang="en">
<head>
    <!--Shape tutorial help: https://archive.p5js.org/examples/form-star.html
        particle system: https://editor.p5js.org/codingtra/sketches/D4ty3DgZB
        i had trouble adding audio so i needed this as well: https://www.w3schools.com/html/html5_audio.asp-->
    <meta charset="UTF-8">
    <title>Welcome back!</title>
    <link rel="stylesheet" href="style.css">
    <script src="p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: relative; 
        }
        #discoGif {
            position: absolute;
            top: 10px; 
            left: 50%;
            transform: translateX(-50%);
            width: 150px; 
            height: auto;
            z-index: 20; 
        }
        .fairyRow {
            position: absolute;
            bottom: 100px; 
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px; 
            z-index: 10; 
        }
        .fairyRow img {
            width: auto; 
            height: 199px;
        }
        .partyButton {
            background-color: #ff69b4; 
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        .partyButton:hover {
            background-color: #ff1493; 
        }
    </style>
</head>
<body>
    <img id="discoGif" src="disco.gif" alt="Disco">
    <div class="fairyRow">
        <img id="badFairy" src="badfairy.png" alt="Bad Fairy">
        <img id="goodFairy" src="goodfairy.png" alt="Good Fairy">
        <img id="alyssaFairy" src="AlyssaFairy.png" alt="Alyssa Fairy">
    </div>
    <button id="partyButton" class="partyButton">START THE FAIRY PARTY!!!</button>
    <audio id="partyMusic" src="Music.mp3"></audio>
    <script src="sketch.js"></script>
</body>
</html>
